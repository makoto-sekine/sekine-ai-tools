name: TimeManager
options:
  bundleIdPrefix: co.brewus.timemanager
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  TimeManager:
    type: application
    platform: macOS
    sources:
      - path: Sources/TimeManager
        excludes:
          - "Info.plist"
          - "TimeManager.entitlements"
    resources:
      - path: Resources
        optional: true
    info:
      path: Sources/TimeManager/Info.plist
      properties:
        CFBundleName: TimeManager
        CFBundleDisplayName: TimeManager
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 Brewus, Inc."
        NSUserNotificationAlertStyle: alert
    entitlements:
      path: Sources/TimeManager/TimeManager.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.brewus.timemanager.TimeManager
        PRODUCT_NAME: TimeManager
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSMainNibFile: ""
        INFOPLIST_KEY_NSPrincipalClass: "NSApplication"

  TimeManagerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/TimeManagerTests
    dependencies:
      - target: TimeManager
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TimeManager.app/Contents/MacOS/TimeManager"
        PRODUCT_BUNDLE_IDENTIFIER: co.brewus.timemanager.Tests

schemes:
  TimeManager:
    build:
      targets:
        TimeManager: all
        TimeManagerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TimeManagerTests
    archive:
      config: Release
